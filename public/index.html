<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Model Speed Race</title>
    <meta name="description" content="A game that races AI models through the same queue of decisions, so you can see how fast Microsoft Decision 1, JEV and LLMs really are." />
    <link rel="stylesheet" href="/styles.css" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%23ffd97a'/%3E%3Ctext x='32' y='45' font-size='36' text-anchor='middle' font-family='Consolas,monospace' font-weight='700' fill='%23261d02'%3E1%3C/text%3E%3C/svg%3E" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <h1>AI MODEL SPEED RACE</h1>
          <span class="subtitle">Fast decision models vs LLMs</span>
        </div>
        <p id="statusText" class="status" role="status" aria-live="polite">Loading...</p>
        <span id="modeBadge" class="badge"></span>
        <div class="actions">
          <button id="startBtn" class="btn primary" disabled>Start shift</button>
          <button id="resetBtn" class="btn" disabled>Reset</button>
          <button id="resultsBtn" class="btn" disabled>Results</button>
          <button id="focusBtn" class="btn" aria-pressed="false" title="Hide the side panel so the hall fills the window (F)">Focus view</button>
        </div>
      </header>

      <main class="main">
        <section class="stage">
          <canvas id="stage" aria-label="Top-down view of three approval desks, each with a queue of applicants"></canvas>
        </section>
        <aside class="side">
          <nav class="tabs" role="tablist" aria-label="Side panel">
            <button class="tab active" role="tab" data-tab="case" aria-selected="true">Case file</button>
            <button class="tab" role="tab" data-tab="rules" aria-selected="false">Rulebook</button>
            <button class="tab" role="tab" data-tab="about" aria-selected="false">About JEV</button>
            <button class="tab" role="tab" data-tab="setup" aria-selected="false">Setup</button>
          </nav>
          <div id="panel" class="panel" role="tabpanel"></div>
        </aside>
      </main>
    </div>

    <dialog id="results" aria-label="Shift report"></dialog>
    <div id="toast" class="toast hidden" role="status"></div>
    <script type="module" src="/js/main.js"></script>
  </body>
</html>
